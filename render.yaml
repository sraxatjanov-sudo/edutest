# Render sozlamalari: "Deploy to Render" tugmasi shu faylni o'qiydi
services:
  - type: web
    name: edutest
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 22.22.0
      # Ma'lumotlarni saqlash: yopiq GitHub ombori va token (README → "Ma'lumotlarni saqlash")
      - key: BACKUP_REPO
        sync: false
      - key: BACKUP_TOKEN
        sync: false
